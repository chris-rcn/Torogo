[cgos-server]
# Torogo 13x13 toroidal CGOS.  Paths are relative to the server's working
# directory (cgos/run.js uses cgos/data/13x13).

serverName = Torogo 13x13 toroidal CGOS
htmlInfoMsg = Toroidal 13x13 - komi 3.5 - 5 minutes per side

portNumber = 1920

boardsize = 13
komi      = 3.5
# Game2 implements simple ko, so the server must not be stricter.
ko        = SIMPLE
rule      = Chinese

# Time per player per game, in seconds.  Engines use a fixed per-move
# budget, so this is just a generous ceiling (and the anti-hang forfeit).
level     = 300
timeGift  = 0.25

# Local-ladder scheduling: don't leave the machine idle between rounds.
# (Upstream defaults, meant for internet play: 45 / 15 / 3 seconds.)
startupDelay    = 3
scheduleInterval = 2
matchStartDelay = 0.25

database_state_file   = cgos.state
game_archive_database = archive.db
web_data_file         = wdata.txt

# New engines actually start at the average rating of waiting players.
defaultRating = 1600.0
# K starts at maxK for new players (fast convergence) and decays to minK.
minK          = 3.0
maxK          = 200.0

htmlDir = html
sgfDir  = SGF
compressSgf = False
moveIntervalBetweenSave = 0

provisionalAge  = 30.0
establishedAge  = 365.0

killFile = killCgos

bad_users_file =
hashPassword = False
matchMode = AUTO

# Refit all ratings with the anchored Bradley-Terry MLE every N
# finalized games and write them back (matchmaking uses them too).
mleInterval = 10
